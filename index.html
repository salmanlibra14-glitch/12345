<style>
:root{--bg:#f4f5f9;--card:#fff;--tx:#1b1d29;--mu:#6b7080;--ac:#6c5ce7;--me:#6c5ce7;--meTx:#fff;--ot:#e9eaf2;--bd:#dfe1ec;--red:#e5484d;--grn:#2fb673;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14151c;--card:#1d1f2a;--tx:#eceef7;--mu:#9a9fb3;--ot:#2a2d3b;--bd:#2c2f40}}
:root[data-theme="dark"]{--bg:#14151c;--card:#1d1f2a;--tx:#eceef7;--mu:#9a9fb3;--ot:#2a2d3b;--bd:#2c2f40}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{height:100%;max-width:760px;margin:auto;display:flex;flex-direction:column;background:var(--card)}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--bd)}
header h1{font-size:17px;margin:0;flex:1}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mu);display:inline-block;margin-right:5px}.dot.on{background:var(--grn)}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:8px 12px;background:var(--ot);color:var(--tx)}
button.p{background:var(--ac);color:#fff}button.r{background:var(--red);color:#fff}button.g{background:var(--grn);color:#fff}
#call{display:none;background:#000;position:relative}
#call.show{display:block}
#remote{width:100%;max-height:44vh;background:#111;display:block;object-fit:contain}
#local{position:absolute;right:8px;bottom:56px;width:30%;max-width:150px;border-radius:10px;border:2px solid #fff;background:#222}
#ctl{display:flex;gap:8px;justify-content:center;padding:8px;background:#0008}
#filters{display:flex;gap:6px;overflow-x:auto;padding:8px;background:#111}
#filters button{flex:none;font-size:13px;padding:6px 10px;background:#2a2d3b;color:#fff}
#filters button.on{background:var(--ac)}
#msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:6px}
.m{max-width:78%;padding:8px 12px;border-radius:16px;background:var(--ot);align-self:flex-start;word-break:break-word}
.m.me{background:var(--me);color:var(--meTx);align-self:flex-end}
.m small{display:block;font-size:11px;opacity:.7;margin-bottom:2px}
.sys{align-self:center;color:var(--mu);font-size:12px}
form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--bd)}
input{flex:1;font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);min-width:0}
#ring{display:none;position:fixed;inset:0;background:#000a;align-items:center;justify-content:center;z-index:9}
#ring.show{display:flex}#ring div{background:var(--card);padding:24px;border-radius:16px;text-align:center}
#login{padding:40px 20px;text-align:center}
#ol{display:flex;gap:6px;flex-wrap:wrap;padding:6px 14px;border-bottom:1px solid var(--bd);font-size:13px;color:var(--mu);align-items:center}
#ol b{background:var(--ot);color:var(--tx);border-radius:12px;padding:3px 10px;font-weight:500}
.m img{display:block;max-width:100%;border-radius:10px;margin:4px 0}
#em{display:none;flex-wrap:wrap;gap:2px;padding:8px;border-top:1px solid var(--bd);max-height:130px;overflow-y:auto}
#em.show{display:flex}#em span{font-size:24px;cursor:pointer;padding:3px}
form button{padding:8px 10px}
:root[data-rel="love"]{--ac:#e84393;--me:#e84393;--board:#fde4ef}
@media (prefers-color-scheme:dark){:root[data-rel="love"]:not([data-theme="light"]){--board:#2e1a25}}
:root[data-theme="dark"][data-rel="love"]{--board:#2e1a25}
#msgs{background:var(--board,transparent)}

:root[data-rel="dora2"] #msgs{background-image:linear-gradient(#ffffff8c,#ffffff8c),var(--board);background-size:cover;background-position:center}
@media (prefers-color-scheme:dark){:root[data-rel="dora2"]:not([data-theme="light"]) #msgs{background-image:linear-gradient(#14151cc0,#14151cc0),var(--board)}}
:root[data-theme="dark"][data-rel="dora2"] #msgs{background-image:linear-gradient(#14151cc0,#14151cc0),var(--board)}
:root[data-rel="dora2"] .sys{background:var(--card);padding:3px 10px;border-radius:12px;opacity:.9}

:root[data-rel="family"]{--ac:#e17f12;--me:#e17f12}
:root[data-rel="work"]{--ac:#0984e3;--me:#0984e3}
header{border-bottom:2px solid var(--ac)}
select{font:inherit;border:0;border-radius:10px;padding:8px 6px;background:var(--ot);color:var(--tx);cursor:pointer}
:root[data-rel^="dora"] #app{background:linear-gradient(#0000001a,#0000001a),var(--board) center/cover no-repeat}
:root[data-rel^="dora"] #msgs{background:none!important}
:root[data-rel^="dora"] header,:root[data-rel^="dora"] #ol,:root[data-rel^="dora"] form{background:#00000026;border:0;color:#fff}
:root[data-rel^="dora"] #ol{color:#ffffffd9}
:root[data-rel^="dora"] #ol b{background:#ffffff33;color:#fff}
:root[data-rel^="dora"] #login h2,:root[data-rel^="dora"] #login p{color:#fff!important}
:root[data-rel^="dora"] header button,:root[data-rel^="dora"] select,:root[data-rel^="dora"] form button:not(.p){background:#ffffff38;color:#fff}
:root[data-rel^="dora"] select option{color:#000}
:root[data-rel^="dora"] input{background:#ffffff30;border:1px solid #ffffff59;color:#fff}
:root[data-rel^="dora"] input::placeholder{color:#ffffffbf}
:root[data-rel^="dora"] .m{background:#0000007a;color:#fff}
:root[data-rel^="dora"] .m small{opacity:.8}
:root[data-rel="dora"] .m.me{background:linear-gradient(135deg,#2d9cdb,#8b5cf6)}
:root[data-rel="dora2"] .m.me{background:linear-gradient(135deg,#f08a3c,#e84393)}
:root[data-rel^="dora"] .sys{background:#00000066;color:#fff;opacity:1}
:root[data-rel^="dora"] #em{background:#000000a6}
html,body{overflow:hidden}
#app{max-width:430px;height:100dvh;position:relative;overflow:hidden}
header{gap:6px;padding:8px 10px}
header h1{font-size:15px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#st{font-size:12px;white-space:nowrap}
header button,header select{padding:6px 8px;font-size:13px}
input{font-size:16px}
#msgs{padding:12px 10px}
.m{max-width:82%}
form{padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
#login{padding:70px 24px}
@media (min-width:600px){body{background:linear-gradient(135deg,#c9c4f5,#f7c6dc)}#app{height:min(860px,94vh);margin:3vh auto;border-radius:34px;border:9px solid #15161d;box-shadow:0 24px 70px #0005}}

#st{font-size:0}#st .dot{margin:0 4px}
#rel{max-width:84px}#vis{max-width:52px}
header button{padding:6px 8px}#dl,#lk{flex:none}
</style></head>
<body><div id="app">
<div id="login"><h2>💬 ChatBox</h2><p style="color:var(--mu)">Apna naam likho aur dost ko yahi link bhejo</p>
<input id="nm" placeholder="Tumhara naam" maxlength="20"> <button class="p" id="go">Start</button></div>
<div id="main" style="display:none;flex:1;min-height:0;flex-direction:column">
<header><h1 id="ttl">💬 ChatBox</h1><span id="st"><span class="dot"></span>offline</span>
<select id="rel" title="Theme"><option value="friend">💬 Dost</option><option value="love">💕 Pyaar</option><option value="family">🏡 Family</option><option value="work">💼 Work</option><option value="dora">🐱 Doraemon</option><option value="dora2">🧡 Doraemon Love</option><option value="dora3">🌙 Romantic Night</option><option value="dora4">🌳 Village Love</option></select><select id="vis" title="Status"><option value="on">🟢</option><option value="busy">🔴</option><option value="away">🟡</option><option value="off">⚫</option></select><button id="vc" title="Video call">📹</button><button id="ac" title="Voice call">📞</button><button id="lk" title="Lock">🔒</button><button id="dl" title="Chat delete">🗑</button></header>
<div id="ol"></div>
<div id="call"><video id="remote" autoplay playsinline></video><canvas id="local"></canvas>
<div id="filters"></div>
<div id="ctl"><button id="mute">🎤 Mute</button><button id="cam">📷 Camera</button><button class="r" id="end">Call khatam</button></div></div>
<div id="msgs"></div>
<div id="em"></div>
<form id="f"><button type="button" id="eb">😊</button><button type="button" id="pb">🖼️</button><button type="button" id="mb">🎤</button><button type="button" id="mc" style="display:none">✖</button><input type="file" id="pf" accept="image/*" hidden><input id="t" placeholder="Message likho..." autocomplete="off"><button class="p">Send</button></form>
</div></div>
<div id="dm"><div><h3 style="margin:0">🗑 Chat history</h3><button type="button" id="d1">Sirf meri screen se saaf karo</button><button type="button" class="r" id="d2"></button><button type="button" id="dx">Cancel</button></div></div>
<div id="lock"><h2 id="lt"></h2><div id="ld"><i></i><i></i><i></i><i></i></div><div id="lm"></div><div id="kp"></div><button type="button" id="ls"></button></div>
<div id="ring"><div><h3 id="rn"></h3><p id="rt"></p><button class="g" id="acc">Utha lo</button> <button class="r" id="rej">Cut</button></div></div>
<script>
const $=id=>document.getElementById(id);
const FL=[{n:'Normal',f:'none'},{n:'B&W',f:'grayscale(1) contrast(1.1)'},{n:'Sepia',f:'sepia(1)'},{n:'Warm 🌅',f:'sepia(.4) saturate(1.5) brightness(1.05)'},{n:'Cool ❄️',f:'hue-rotate(160deg) saturate(1.2)'},{n:'Vivid 🌈',f:'saturate(2) contrast(1.15)'},{n:'Alien 👽',f:'invert(1) hue-rotate(120deg)'},{n:'Zombie 🧟',f:'grayscale(.6) sepia(1) hue-rotate(60deg) contrast(1.4) saturate(2)'},{n:'Wavy 🌊',wv:1},{n:'Neon 💜',f:'hue-rotate(270deg) saturate(3) contrast(1.2)'},{n:'Night 🟢',f:'grayscale(1) sepia(1) hue-rotate(70deg) brightness(1.2) contrast(1.5)'},{n:'Sketch ✏️',f:'grayscale(1) contrast(3) brightness(1.3)'},{n:'Mirror 🪞',mr:1},{n:'Glitch 📺',gl:1}];
let clearedAt=0;try{clearedAt=+localStorage.getItem('clr')||0}catch(e){}
let seenAt=0,unread=0;try{seenAt=+localStorage.getItem('seen')||0}catch(e){}
function markSeen(){if(document.hidden)return;unread=0;document.title='ChatBox Messenger';try{localStorage.setItem('seen',Date.now())}catch(e){}}
document.addEventListener('visibilitychange',markSeen);setInterval(markSeen,4000);
let admin=false;const me=Math.random().toString(36).slice(2,10);let db=null,uid='',name='',room=null,pc=null,peer=null,stream=null,out=null,fi=0,timer=null,pending=null,vid=true,camOn=true;
const cv=$('local'),cx=cv.getContext('2d'),sm=document.createElement('canvas'),sx=sm.getContext('2d');
const src=document.createElement('video');src.muted=true;src.playsInline=true;
FL.forEach((f,i)=>{const b=document.createElement('button');b.textContent=f.n;b.onclick=()=>{fi=i;[...$('filters').children].forEach((c,j)=>c.classList.toggle('on',j==i))};if(!i)b.className='on';$('filters').appendChild(b)});
function add(who,txt,mine,img,aud){const d=document.createElement('div');if(!who){d.className='sys';d.textContent=txt}else{d.className='m'+(mine?' me':'');const s=document.createElement('small');s.textContent=mine?'Tum':who;const p=document.createElement('span');p.textContent=txt;if(mine)d.append(p);else d.append(s,p);if(img){const i=document.createElement('img');i.src=img;d.appendChild(i)}if(aud){const a=document.createElement('audio');a.controls=true;a.preload='metadata';a.src=aud;d.appendChild(a)}}$('msgs').appendChild(d);$('msgs').scrollTop=1e9}
function setSt(n){$('st').innerHTML='<span class="dot'+(n?' on':'')+'"></span>'+(n?n+' online':'offline')}
async function init(){
  name=$('nm').value.trim()||'Dost';$('login').style.display='none';$('main').style.display='flex';
  try{room=await claude.use('room')}catch(e){}
  if(!room){admin=true;add(0,'Yeh download ki hui copy hai, isme chat nahi chalti. Neeche wale button se asli chat kholo.');const ra=document.createElement('a');ra.href='https://claude.ai/artifact/1dBRAXGtCavzpM4G1RQ7NQ';ra.target='_blank';ra.rel='noopener';ra.textContent='👉 Asli chat kholo';ra.style.cssText='color:#fff;background:#6c5ce7;padding:12px 18px;border-radius:14px;text-decoration:none;align-self:center;margin-top:8px;font-weight:600';$('msgs').appendChild(ra);return}
  await room.presence({name,id:me});
  const upd=()=>{const o=room.peers().filter(p=>!p.isMe&&!p.presence.hidden);setSt(o.length);const l=$('ol');l.textContent=o.length?'🟢 Abhi online:':'Koi online nahi — message bhej do, wo save ho jayega aur dost ko online aate hi mil jayega';o.forEach(p=>{const b=document.createElement('b');b.textContent=({busy:'🔴 ',away:'🟡 '}[p.presence.status]||'🟢 ')+String(p.presence.name||'Dost').slice(0,20);l.appendChild(b)})};
  room.onPeers(upd);upd();
  uid=me;try{const u=await claude.use('user');if(u){uid=await u.id();admin=!!(await u.isOwner()||await u.canEdit())}}catch(e){}
  try{db=await claude.use('db')}catch(e){}
  if(!db)add(0,'⚠️ Chat save nahi ho rahi: messages sirf tab jayenge jab samne wala online ho. Claude mein login karke link kholo.');
  if(!admin){$('rel').disabled=true;$('rel').title='Sirf admin theme badal sakta hai';$('vis').style.display='none'}
  else add(0,'Tum admin ho 👑 — theme sirf tum badal sakti ho');
  if(db){const sd=db.collection('settings').doc('main');
    if(admin){sd.set({rel:$('rel').value}).catch(()=>{})}
    else sd.onSnapshot(s=>{const d=s.exists&&s.data();if(d&&RL[d.rel])setRel(d.rel)},()=>{})}
  if(db){const seen=new Set();let ready=false,shown=false;db.collection('messages').orderBy('ts').limit(200).onSnapshot(s=>{const rm=s.docChanges().some(c=>c.type==='removed');if(rm){$('msgs').innerHTML='';seen.clear()}(rm?s.docs.map(doc=>({type:'added',doc})):s.docChanges()).forEach(c=>{if(c.type!=='added'||seen.has(c.doc.id))return;seen.add(c.doc.id);const d=c.doc.data()||{};if(d.ts<=clearedAt)return;if(!ready&&!shown&&d.ts>seenAt&&d.uid!==uid){add(0,'📬 Yahan se naye messages hain (jab tum offline thi)');shown=true}if(ready&&d.uid!==uid&&document.hidden){unread++;document.title='('+unread+') ChatBox'}add(String(d.name||'Dost').slice(0,20),String(d.text||'').slice(0,2000),d.uid===uid,typeof d.img==='string'&&d.img.startsWith('data:image/')?d.img:null,typeof d.aud==='string'&&d.aud.startsWith('data:audio/')?d.aud:null)});if(rm&&s.empty)add(0,'Chat history delete ho gayi 🗑');ready=true;markSeen()},()=>add(0,'Purani chat load nahi hui'))}
  else room.on('msg',m=>{if(m.isMe||!m.data)return;add(String(m.data.name||'Dost').slice(0,20),String(m.data.text).slice(0,2000),false)});
  room.on('theme',m=>{if(!admin&&m.data&&RL[m.data.rel])setRel(m.data.rel)});
  room.onPeers(()=>{if(admin)room.emit('theme',{rel:$('rel').value})});
  room.on('sig',onSig);add(0,'Dost ko ye link bhejo, wo khulte hi yahan online dikhega 👋');
}
$('go').onclick=init;$('nm').onkeydown=e=>{if(e.key=='Enter')init()};
async function post(text,img,aud){if(db){try{await db.collection('messages').add({name,uid,text:text||'',img:img||null,aud:aud||null,ts:Date.now()})}catch(e){add(0,'Message send nahi hua'+(e&&e.code?' ('+e.code+')':'')+'. Agar access sirf dekhne ka hai to owner se contributor access lo.')}}else{add(name,text,true,img);room.emit('msg',{name,text})}}
let rec=null,chunks=[],rt=null,rs=0,cancelRec=false;
$('mb').onclick=async()=>{
  if(rec){rec.stop();return}
  if(!room)return;
  if(!db){add(0,'Voice note ke liye chat save hona zaroori hai (page claude.ai se kholo)');return}
  if(!window.MediaRecorder){add(0,'Is browser mein voice note support nahi');return}
  let st;try{st=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){add(0,'Mic allow nahi hua. Browser ki site settings mein Microphone "Allow" karo, phir page refresh karo. Agar app ke andar khola hai to Chrome/Safari mein kholo.');return}
  chunks=[];cancelRec=false;rs=0;
  try{rec=new MediaRecorder(st,{audioBitsPerSecond:16000})}catch(e){rec=new MediaRecorder(st)}
  rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  rec.onstop=async()=>{clearInterval(rt);st.getTracks().forEach(t=>t.stop());const type=rec.mimeType||'audio/webm';rec=null;$('mb').textContent='🎤';$('mb').classList.remove('r');$('mc').style.display='none';
    if(cancelRec||!chunks.length)return;
    const u=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(new Blob(chunks,{type}))});
    if(u.length>190000){add(0,'Voice note bohot lambi hai, chhoti bhejo');return}
    post('',null,u)};
  rec.start();$('mb').classList.add('r');$('mc').style.display='';$('mb').textContent='⏹ 0:00';
  rt=setInterval(()=>{rs++;$('mb').textContent='⏹ '+Math.floor(rs/60)+':'+String(rs%60).padStart(2,'0');if(rs>=45&&rec)rec.stop()},1000)};
$('mc').onclick=()=>{if(rec){cancelRec=true;rec.stop()}};
$('f').onsubmit=e=>{e.preventDefault();const t=$('t').value.trim();if(!t)return;if(!room){add(0,'Message nahi ja sakta: page online connect nahi hai. Link claude.ai se kholo.');return}post(t);$('t').value='';$('em').classList.remove('show')};
'😀😂🥹😍😘😎🤩😜🤪😴😡😭🥳🤔🙄😱🤗👍👎👏🙌🙏💪🔥✨💖💔🎉🎂🍕☕🌹🌙⭐😇🤣😅👋🤝❤️'.match(/\p{Extended_Pictographic}\uFE0F?/gu).forEach(x=>{const s=document.createElement('span');s.textContent=x;s.onclick=()=>{$('t').value+=x;$('t').focus()};$('em').appendChild(s)});
$('eb').onclick=()=>$('em').classList.toggle('show');
$('pb').onclick=()=>$('pf').click();
$('pf').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f||!room)return;try{const im=await createImageBitmap(f),k=Math.min(1,600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);let q=.7,u=c.toDataURL('image/jpeg',q);while(u.length>180000&&q>.2){q-=.15;u=c.toDataURL('image/jpeg',q)}post('',u)}catch(x){add(0,'Photo bhej nahi paya')}};
const sig=(o)=>room.emit('sig',Object.assign({from:me,name},o));
async function media(v){
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true,video:v?{width:640,height:480,facingMode:'user'}:false})}
  catch(e){add(0,'Camera/mic allow nahi hua: '+e.message);return false}
  vid=v;camOn=v;$('call').classList.add('show');$('filters').style.display=v?'flex':'none';cv.style.display=v?'block':'none';$('cam').style.display=v?'':'none';
  out=new MediaStream(stream.getAudioTracks());
  if(v){src.srcObject=stream;await src.play();cv.width=480;cv.height=360;timer=setInterval(draw,33);cv.captureStream(30).getVideoTracks().forEach(t=>out.addTrack(t))}
  return true}
function draw(){const w=cv.width,h=cv.height,f=FL[fi];if(!camOn){cx.filter='none';cx.fillStyle='#000';cx.fillRect(0,0,w,h);return}
  if(f.px){sm.width=40;sm.height=30;sx.drawImage(src,0,0,40,30);cx.imageSmoothingEnabled=false;cx.filter='saturate(1.4)';cx.drawImage(sm,0,0,w,h);cx.imageSmoothingEnabled=true}
  else if(f.wv){cx.filter='none';const t=Date.now()/200;for(let y=0;y<h;y+=6)cx.drawImage(src,0,y*src.videoHeight/h,src.videoWidth,6*src.videoHeight/h,Math.sin(y/20+t)*14,y,w,6)}
  else if(f.mr){cx.filter='none';cx.save();cx.translate(w,0);cx.scale(-1,1);cx.drawImage(src,0,0,w,h);cx.restore()}
  else if(f.gl){cx.filter='none';cx.fillStyle='#000';cx.fillRect(0,0,w,h);cx.globalCompositeOperation='screen';cx.filter='sepia(1) hue-rotate(-50deg) saturate(5)';cx.drawImage(src,-8,0,w,h);cx.filter='hue-rotate(160deg) saturate(5) sepia(.5)';cx.drawImage(src,8,0,w,h);cx.globalCompositeOperation='source-over'}
  else{cx.filter=f.f;cx.drawImage(src,0,0,w,h)}}
function mkpc(){pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
  out.getTracks().forEach(t=>pc.addTrack(t,out));
  pc.ontrack=e=>{$('remote').srcObject=e.streams[0]};
  pc.onicecandidate=e=>{if(e.candidate)sig({t:'ice',to:peer,c:e.candidate})};
  pc.onconnectionstatechange=()=>{if(['failed','closed'].includes(pc.connectionState))hang(false)}}
async function call(v){if(!room||pc)return;if(!room.peers().some(p=>!p.isMe&&!p.presence.hidden)){add(0,'Dost abhi online nahi hai');return}
  if(!await media(v))return;mkpc();const o=await pc.createOffer();await pc.setLocalDescription(o);add(0,(v?'Video':'Voice')+' call ho rahi hai...');sig({t:'offer',to:null,sdp:o,v})}
$('vc').onclick=()=>call(true);$('ac').onclick=()=>call(false);
async function onSig(m){const d=m.data;if(!d||m.isMe||d.from===me||(d.to&&d.to!==me))return;
  if(d.t=='offer'){if(pc||pending)return;pending=d;$('rn').textContent=String(d.name||'Dost').slice(0,20)+' call kar raha hai';$('rt').textContent=d.v?'📹 Video call':'📞 Voice call';$('ring').classList.add('show')}
  else if(d.t=='answer'&&pc&&!peer){peer=d.from;await pc.setRemoteDescription(d.sdp);add(0,'Call connect ho gayi ✅')}
  else if(d.t=='ice'&&pc&&d.c){try{await pc.addIceCandidate(d.c)}catch(e){}}
  else if(d.t=='bye'&&(d.from===peer||!peer)){hang(false)}
  else if(d.t=='bye'&&pending&&d.from===pending.from){pending=null;$('ring').classList.remove('show')}}
$('acc').onclick=async()=>{const d=pending;pending=null;$('ring').classList.remove('show');if(!d||!await media(d.v))return;peer=d.from;mkpc();await pc.setRemoteDescription(d.sdp);const a=await pc.createAnswer();await pc.setLocalDescription(a);sig({t:'answer',to:peer,sdp:a});add(0,'Call connect ho gayi ✅')};
$('rej').onclick=()=>{if(pending)sig({t:'bye',to:pending.from});pending=null;$('ring').classList.remove('show')};
function hang(send){if(send&&room)sig({t:'bye',to:peer});clearInterval(timer);if(pc)pc.close();pc=null;peer=null;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;out=null;$('remote').srcObject=null;$('call').classList.remove('show');add(0,'Call khatam')}
$('end').onclick=()=>hang(true);
$('vis').onchange=async()=>{const v=$('vis').value;if(!room)return;await room.presence({hidden:v==='off',status:v});add(0,{on:'Ab tum online ho 🟢',busy:'Ab tum busy dikhoge 🔴',away:'Ab tum away dikhoge 🟡',off:'Ab tum dosto ko offline dikhoge ⚫'}[v])};
const RL={friend:'💬',love:'💕',family:'🏡',work:'💼',dora:'🐱',dora2:'🧡',dora3:'🌙',dora4:'🌳'};
function setRel(v){document.documentElement.dataset.rel=v;$('rel').value=v;$('ttl').textContent=RL[v]+' ChatBox'}
$('rel').onchange=()=>{if(!admin)return;const v=$('rel').value;setRel(v);if(room)room.emit('theme',{rel:v});if(db)db.collection('settings').doc('main').set({rel:v}).catch(()=>{});try{localStorage.setItem('rel',v)}catch(e){}};
try{const s=localStorage.getItem('rel');if(RL[s])setRel(s)}catch(e){}
const LK=$('lock');let pin='',mode='enter',tmp='',stored=null,hiddenAt=0,skipped=false;
try{stored=localStorage.getItem('pinh');skipped=!!localStorage.getItem('pinskip')}catch(e){}
const hsh=s=>(window.crypto&&crypto.subtle)?crypto.subtle.digest('SHA-256',new TextEncoder().encode('cb:'+s)).then(b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')):Promise.resolve('p:'+s);
const TT={enter:'PIN daalo 🔒',old:'Purana PIN daalo',new1:'Naya PIN banao',new2:'PIN dobara daalo'};
function lockUI(msg){$('lt').textContent=TT[mode];$('lm').textContent=msg||(mode==='new1'&&!stored?'Ek baar hi banega, baad mein badla nahi ja sakta':'');[...$('ld').children].forEach((d,i)=>d.classList.toggle('on',i<pin.length));
  const s=$('ls');s.style.display='';if(mode==='enter')s.style.display='none';else if(!stored&&mode==='new1')s.textContent='Abhi nahi';else s.style.display='none'}
function showLock(m){mode=stored?'enter':'new1';pin='';tmp='';LK.style.display='flex';lockUI(m)}
function unlock(){LK.style.display='none';pin='';mode='enter'}
async function lockDone(){const p=pin;pin='';
  if(mode==='enter'||mode==='old'){const h=await hsh(p);if(h===stored){if(mode==='old'){mode='new1';lockUI('')}else unlock()}else{LK.classList.add('shake');setTimeout(()=>LK.classList.remove('shake'),400);lockUI('Galat PIN')}}
  else if(mode==='new1'){tmp=p;mode='new2';lockUI('')}
  else if(mode==='new2'){if(p===tmp){stored=await hsh(p);try{localStorage.setItem('pinh',stored);localStorage.removeItem('pinskip')}catch(e){}unlock()}else{mode='new1';tmp='';lockUI('PIN match nahi hua, dobara banao')}}}
['1','2','3','4','5','6','7','8','9','','0','⌫'].forEach(k=>{const b=document.createElement('button');b.type='button';b.textContent=k;if(!k)b.style.visibility='hidden';b.onclick=()=>{if(!k)return;if(k==='⌫')pin=pin.slice(0,-1);else if(pin.length<4)pin+=k;lockUI('');if(pin.length===4)setTimeout(lockDone,120)};$('kp').appendChild(b)});
$('ls').onclick=()=>{if(mode==='enter'){mode='old';pin='';lockUI('')}else if(!stored){try{localStorage.setItem('pinskip','1')}catch(e){}unlock()}else showLock('')};
$('lk').onclick=()=>showLock('');
let sure=false;const dmClose=()=>$('dm').classList.remove('show');
$('dl').onclick=()=>{sure=false;$('d2').textContent='🗑 Dono taraf se delete karo';$('dm').classList.add('show')};
$('dx').onclick=dmClose;
$('d1').onclick=()=>{clearedAt=Date.now();try{localStorage.setItem('clr',String(clearedAt))}catch(e){}$('msgs').innerHTML='';add(0,'Tumhari screen se chat saaf ho gayi (dost ke paas abhi bhi hai)');dmClose()};
$('d2').onclick=async()=>{if(!db){dmClose();add(0,'Delete ke liye chat save hona zaroori hai (claude.ai se login karke kholo)');return}
  if(!sure){sure=true;$('d2').textContent='⚠️ Pakka? Dobara dabao';return}
  dmClose();
  try{let s;do{s=await db.collection('messages').limit(500).get();await Promise.all(s.docs.map(d=>db.collection('messages').doc(d.id).delete()))}while(s.size>=500)}
  catch(e){add(0,'Delete nahi hua'+(e&&e.code?' ('+e.code+')':'')+'. Contributor access chahiye.')}};
document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenAt=Date.now();else if(stored&&hiddenAt&&Date.now()-hiddenAt>15000&&LK.style.display==='none')showLock('')});
if(stored||!skipped)showLock('');else unlock();
$('mute').onclick=()=>{const t=stream&&stream.getAudioTracks()[0];if(!t)return;t.enabled=!t.enabled;$('mute').textContent=t.enabled?'🎤 Mute':'🔇 Unmute'};
$('cam').onclick=()=>{camOn=!camOn;$('cam').textContent=camOn?'📷 Camera':'🚫 Camera on karo'};
</script></body></html>
